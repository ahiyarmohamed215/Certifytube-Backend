spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/certifytube?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=%2B05:30&forceConnectionTimeZoneToSession=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=+05:30
spring.jackson.time-zone=Asia/Colombo

ml.feature-version=v1.0
ml.base-url=${ML_BASE_URL:http://localhost:8000}
ml.engagement-threshold=0.85
ml.default-model=xgboost

# For production, always set AUTH_JWT_SECRET in environment.
auth.jwt.secret=${AUTH_JWT_SECRET:dev-only-change-this-secret-before-production-2026-03-14-very-long}
auth.jwt.expiration-minutes=120
auth.jwt.revoked-cleanup-ms=3600000
auth.password-reset.expiry-minutes=15
auth.email-verification.expiry-hours=24
auth.tokens.cleanup-ms=3600000
auth.rate-limit.window-minutes=60
auth.rate-limit.email.max-requests=5
auth.rate-limit.ip.max-requests=30
auth.rate-limit.cooldown-seconds=30
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}
app.mail.from=${APP_MAIL_FROM:${MAIL_USERNAME:}}
app.company-name=${APP_COMPANY_NAME:CertifyTube}
app.support-email=${APP_SUPPORT_EMAIL:${APP_MAIL_FROM:${MAIL_USERNAME:}}}
app.mail.reply-to=${APP_MAIL_REPLY_TO:}
app.mail.logo-url=${APP_MAIL_LOGO_URL:}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

quiz.min-engagement-score=0.85
quiz.pass-score=80
quiz.max-failed-attempts=2

youtube.api-key=${YOUTUBE_API_KEY:}
youtube.base-url=https://www.googleapis.com/youtube/v3
# Cache TTL (minutes). Example: 1440 = 1 day
youtube.cache-ttl-minutes=1440

# Session resume
session.resume.enabled=true

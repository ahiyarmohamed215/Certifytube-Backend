spring.application.name=backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.tomcat.connection-timeout=${SERVER_CONNECTION_TIMEOUT_MS:120000}
spring.mvc.async.request-timeout=${SPRING_MVC_ASYNC_REQUEST_TIMEOUT_MS:120000}


spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:120000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:120000}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIMEZONE:Asia/Colombo}
spring.jackson.time-zone=${APP_TIMEZONE:Asia/Colombo}

ml.feature-version=v1.0
ml.base-url=${ML_BASE_URL}
ml.client.connect-timeout-ms=${ML_CLIENT_CONNECT_TIMEOUT_MS:120000}
ml.client.response-timeout-ms=${ML_CLIENT_RESPONSE_TIMEOUT_MS:120000}
ml.engagement-threshold=0.85
ml.default-model=xgboost

auth.jwt.secret=${AUTH_JWT_SECRET}
auth.jwt.expiration-minutes=120
auth.jwt.revoked-cleanup-ms=3600000
auth.password-reset.expiry-minutes=15
auth.email-verification.expiry-hours=24
auth.signup.send-verification-email=true
auth.signup.fail-on-email-error=false
auth.tokens.cleanup-ms=3600000
auth.rate-limit.window-minutes=60
auth.rate-limit.email.max-requests=5
auth.rate-limit.ip.max-requests=30
auth.rate-limit.cooldown-seconds=30

app.public-base-url=${APP_PUBLIC_BASE_URL}
app.frontend-base-url=${APP_FRONTEND_BASE_URL}
app.email.provider=${APP_EMAIL_PROVIDER:brevo}
app.email.sender=${APP_EMAIL_SENDER:${APP_MAIL_FROM:${MAIL_USERNAME:}}}
app.email.brevo.api-key=${BREVO_API_KEY:}
app.email.brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com}
app.mail.from=${APP_MAIL_FROM:${APP_EMAIL_SENDER:${MAIL_USERNAME:}}}
app.company-name=${APP_COMPANY_NAME:CertifyTube}
app.support-email=${APP_SUPPORT_EMAIL:${APP_EMAIL_SENDER:${APP_MAIL_FROM:${MAIL_USERNAME:}}}}
app.mail.reply-to=${APP_MAIL_REPLY_TO:}
app.mail.logo-url=${APP_MAIL_LOGO_URL:}
app.http.logging.enabled=${APP_HTTP_LOGGING_ENABLED:true}
app.http.logging.include-body=${APP_HTTP_LOGGING_INCLUDE_BODY:false}
app.http.logging.max-body-chars=${APP_HTTP_LOGGING_MAX_BODY_CHARS:2000}
app.http.logging.skip-paths=${APP_HTTP_LOGGING_SKIP_PATHS:}

# SMTP is optional and used only when APP_EMAIL_PROVIDER=smtp (for local development).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT_MS:120000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT_MS:120000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS:120000}
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

quiz.min-engagement-score=0.85
quiz.pass-score=80
quiz.max-failed-attempts=2

youtube.api-key=${YOUTUBE_API_KEY:}
youtube.base-url=https://www.googleapis.com/youtube/v3
youtube.cache-ttl-minutes=1440

session.resume.enabled=true

spring.application.name=backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework


spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIMEZONE:Asia/Colombo}
spring.jackson.time-zone=${APP_TIMEZONE:Asia/Colombo}

ml.feature-version=v1.0
ml.base-url=${ML_BASE_URL}
ml.engagement-threshold=0.85
ml.default-model=xgboost

auth.jwt.secret=${AUTH_JWT_SECRET}
auth.jwt.expiration-minutes=120
auth.jwt.revoked-cleanup-ms=3600000
auth.password-reset.expiry-minutes=15
auth.email-verification.expiry-hours=24
auth.tokens.cleanup-ms=3600000
auth.rate-limit.window-minutes=60
auth.rate-limit.email.max-requests=5
auth.rate-limit.ip.max-requests=30
auth.rate-limit.cooldown-seconds=30

app.public-base-url=${APP_PUBLIC_BASE_URL}
app.frontend-base-url=${APP_FRONTEND_BASE_URL}
app.mail.from=${APP_MAIL_FROM:${MAIL_USERNAME:}}
app.company-name=${APP_COMPANY_NAME:CertifyTube}
app.support-email=${APP_SUPPORT_EMAIL:${APP_MAIL_FROM:${MAIL_USERNAME:}}}
app.mail.reply-to=${APP_MAIL_REPLY_TO:}
app.mail.logo-url=${APP_MAIL_LOGO_URL:}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

quiz.min-engagement-score=0.85
quiz.pass-score=80
quiz.max-failed-attempts=2

youtube.api-key=${YOUTUBE_API_KEY:}
youtube.base-url=https://www.googleapis.com/youtube/v3
youtube.cache-ttl-minutes=1440

session.resume.enabled=true
